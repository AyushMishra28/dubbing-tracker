<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubbing Tracker — Live Dashboard</title>
    <meta name="description" content="Live dubbing project tracker with automatic monthly totals, synced with Google Sheets.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: rgba(17, 24, 39, 0.7);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --accent-cyan: #06b6d4;
            --paid-bg: rgba(16, 185, 129, 0.12);
            --paid-border: rgba(16, 185, 129, 0.3);
            --paid-text: #34d399;
            --pending-bg: rgba(245, 158, 11, 0.12);
            --pending-border: rgba(245, 158, 11, 0.3);
            --pending-text: #fbbf24;
            --gradient-1: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --gradient-2: linear-gradient(135deg, #10b981, #06b6d4);
            --gradient-3: linear-gradient(135deg, #f59e0b, #f43f5e);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.4);
            --shadow-glow-blue: 0 0 30px rgba(59, 130, 246, 0.15);
            --shadow-glow-green: 0 0 30px rgba(16, 185, 129, 0.15);
            --shadow-glow-amber: 0 0 30px rgba(245, 158, 11, 0.15);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at 20% 20%, rgba(59,130,246,0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(139,92,246,0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 50%, rgba(16,185,129,0.03) 0%, transparent 50%);
            z-index: 0;
            animation: ambientShift 20s ease-in-out infinite;
        }

        @keyframes ambientShift {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            33% { transform: translate(-2%,1%) rotate(1deg); }
            66% { transform: translate(1%,-1%) rotate(-0.5deg); }
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 32px 60px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 36px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-left h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header-left p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: #34d399;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 12px;
            vertical-align: middle;
        }

        .live-dot {
            width: 6px; height: 6px;
            background: #34d399;
            border-radius: 50%;
            animation: livePulse 1.5s infinite;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(52,211,153,0.4); }
            50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(52,211,153,0); }
        }

        .header-actions { display: flex; gap: 12px; flex-wrap: wrap; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--gradient-1);
            color: white;
            box-shadow: 0 4px 15px rgba(59,130,246,0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59,130,246,0.4); }

        .btn-secondary {
            background: var(--glass);
            color: var(--text-secondary);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); transform: translateY(-1px); }

        .btn-green {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16,185,129,0.3);
        }
        .btn-green:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(16,185,129,0.4); }

        .btn.spinning .spin-icon { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 36px;
        }

        .summary-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 24px 28px;
            backdrop-filter: blur(20px);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .summary-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.12); }

        .summary-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .summary-card.total::before { background: var(--gradient-1); }
        .summary-card.paid::before { background: var(--gradient-2); }
        .summary-card.pending::before { background: var(--gradient-3); }
        .summary-card.total:hover { box-shadow: var(--shadow-glow-blue); }
        .summary-card.paid:hover { box-shadow: var(--shadow-glow-green); }
        .summary-card.pending:hover { box-shadow: var(--shadow-glow-amber); }

        .summary-card .card-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            margin-bottom: 16px;
        }
        .summary-card.total .card-icon { background: rgba(59,130,246,0.12); }
        .summary-card.paid .card-icon { background: rgba(16,185,129,0.12); }
        .summary-card.pending .card-icon { background: rgba(245,158,11,0.12); }

        .card-label {
            font-size: 12px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 30px; font-weight: 800;
            letter-spacing: -0.5px;
        }
        .summary-card.total .card-value { color: var(--accent-blue); }
        .summary-card.paid .card-value { color: var(--accent-emerald); }
        .summary-card.pending .card-value { color: var(--accent-amber); }

        .card-count { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

        /* Last Synced */
        .sync-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 24px;
            padding: 10px 16px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xs);
            backdrop-filter: blur(10px);
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar label {
            font-size: 12px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.8px;
            color: var(--text-muted);
        }

        .filter-select, .filter-input {
            padding: 9px 16px;
            border-radius: var(--radius-xs);
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        .filter-select:focus, .filter-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .filter-select option { background: var(--bg-secondary); }

        /* Monthly Sections */
        .month-section {
            margin-bottom: 32px;
            animation: fadeInUp 0.4s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius) var(--radius) 0 0;
            backdrop-filter: blur(20px);
            flex-wrap: wrap;
            gap: 12px;
        }

        .month-header h2 {
            font-size: 18px; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
        }

        .month-totals { display: flex; gap: 20px; flex-wrap: wrap; }

        .month-total-item {
            display: flex; align-items: center; gap: 6px;
            font-size: 13px; font-weight: 600;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-total { background: var(--accent-blue); }
        .dot-paid { background: var(--accent-emerald); }
        .dot-pending { background: var(--accent-amber); }

        .amount { font-weight: 700; }
        .clr-blue { color: var(--accent-blue); }
        .clr-green { color: var(--accent-emerald); }
        .clr-amber { color: var(--accent-amber); }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--glass-border);
            border-top: none;
            border-radius: 0 0 var(--radius) var(--radius);
            background: var(--bg-card);
            backdrop-filter: blur(20px);
        }

        table { width: 100%; border-collapse: collapse; }

        thead th {
            padding: 12px 18px;
            text-align: left;
            font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-muted);
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--glass-border);
            white-space: nowrap;
        }

        tbody tr {
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        tbody tr:hover { background: rgba(255,255,255,0.03); }

        tbody td {
            padding: 14px 18px;
            font-size: 13.5px;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        tbody td:first-child { font-weight: 600; color: var(--text-primary); }

        .studio-tag {
            display: inline-flex;
            align-items: center; gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px; font-weight: 600;
            background: rgba(139,92,246,0.1);
            color: #c4b5fd;
            border: 1px solid rgba(139,92,246,0.15);
        }

        .budget-cell {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary) !important;
        }

        .status-badge {
            display: inline-flex;
            align-items: center; gap: 6px;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px; font-weight: 700;
            user-select: none;
        }

        .status-badge.paid {
            background: var(--paid-bg);
            border: 1px solid var(--paid-border);
            color: var(--paid-text);
        }
        .status-badge.pending {
            background: var(--pending-bg);
            border: 1px solid var(--pending-border);
            color: var(--pending-text);
        }
        .status-badge.unknown {
            background: rgba(100,116,139,0.12);
            border: 1px solid rgba(100,116,139,0.25);
            color: var(--text-muted);
        }

        .status-dot { width: 6px; height: 6px; border-radius: 50%; }
        .status-badge.paid .status-dot { background: var(--paid-text); }
        .status-badge.pending .status-dot {
            background: var(--pending-text);
            animation: pulse 2s infinite;
        }
        .status-badge.unknown .status-dot { background: var(--text-muted); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Loading */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            text-align: center;
        }

        .loading-spinner {
            width: 48px; height: 48px;
            border: 3px solid var(--glass-border);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 14px; font-weight: 500;
        }

        /* Error */
        .error-container {
            text-align: center;
            padding: 60px 24px;
            background: var(--bg-card);
            border: 1px solid rgba(244,63,94,0.2);
            border-radius: var(--radius);
            backdrop-filter: blur(20px);
        }
        .error-container .emoji { font-size: 48px; margin-bottom: 16px; }
        .error-container h3 { font-size: 18px; margin-bottom: 8px; color: var(--accent-rose); }
        .error-container p { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-muted);
        }
        .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px; right: 30px;
            padding: 14px 24px;
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-size: 13px; font-weight: 600;
            box-shadow: var(--shadow-lg);
            z-index: 2000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container { padding: 16px; }
            .header-left h1 { font-size: 24px; }
            .summary-grid { grid-template-columns: 1fr; }
            .month-header { flex-direction: column; align-items: flex-start; }
            .live-badge { margin-left: 0; margin-top: 6px; }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1>🎙️ Dubbing Tracker <span class="live-badge"><span class="live-dot"></span> LIVE</span></h1>
                <p>Auto-synced with your Google Sheet — totals update automatically</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="refreshData()" id="btn-refresh">
                    <span class="spin-icon">🔄</span> Refresh
                </button>
                <button class="btn btn-secondary" onclick="exportCSV()" id="btn-export">📥 Export CSV</button>
                <a class="btn btn-green" href="https://docs.google.com/spreadsheets/d/1S1Sdakmd9Qs3TU4TdQOCw7odxZVCvgumaQg8j5faqFY/edit#gid=0" target="_blank" id="btn-open-sheet">📝 Edit in Google Sheets</a>
            </div>
        </div>

        <!-- Sync Info -->
        <div class="sync-info" id="sync-info">
            ⏳ Loading data from Google Sheets...
        </div>

        <!-- Summary Cards -->
        <div class="summary-grid" id="summary-grid"></div>

        <!-- Filters -->
        <div class="filter-bar" id="filter-bar" style="display:none;">
            <label>Filters:</label>
            <select class="filter-select" id="filter-studio" onchange="renderAll()">
                <option value="">All Studios</option>
            </select>
            <select class="filter-select" id="filter-status" onchange="renderAll()">
                <option value="">All Status</option>
                <option value="Paid">Paid</option>
                <option value="Pending">Pending</option>
            </select>
            <input type="text" class="filter-input" id="filter-search" placeholder="🔍 Search projects..." oninput="renderAll()">
        </div>

        <!-- Content -->
        <div id="content">
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <div class="loading-text">Fetching data from Google Sheets...</div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ─── Config ──────────────────────────────────────────────────────
        const SHEET_ID = '1S1Sdakmd9Qs3TU4TdQOCw7odxZVCvgumaQg8j5faqFY';
        const SHEET_NAME = 'Sheet2';

        let entries = [];
        let lastSynced = null;

        // ─── Parse Budget ────────────────────────────────────────────────
        function parseBudget(raw) {
            if (!raw) return 0;
            const cleaned = raw.replace(/[₹,\/\-\s]/g, '').trim();
            const num = parseInt(cleaned);
            return isNaN(num) ? 0 : num;
        }

        // ─── Parse Date ─────────────────────────────────────────────────
        function parseDate(raw) {
            if (!raw) return null;
            raw = raw.trim();

            const monthNames = {
                'jan': '01', 'january': '01',
                'feb': '02', 'february': '02',
                'mar': '03', 'march': '03',
                'apr': '04', 'april': '04',
                'may': '05',
                'jun': '06', 'june': '06',
                'jul': '07', 'july': '07',
                'aug': '08', 'august': '08',
                'sep': '09', 'september': '09',
                'oct': '10', 'october': '10',
                'nov': '11', 'november': '11',
                'dec': '12', 'december': '12'
            };

            // Format: "04-May", "14-May", "21-May"
            const dashMatch = raw.match(/^(\d{1,2})[- ]([A-Za-z]+)$/);
            if (dashMatch) {
                const day = dashMatch[1].padStart(2, '0');
                const monthKey = dashMatch[2].toLowerCase();
                const month = monthNames[monthKey];
                if (month) return `2025-${month}-${day}`;
            }

            // Format: "11 Feb", "7 March", "28 march"
            const spaceMatch = raw.match(/^(\d{1,2})\s+([A-Za-z]+)$/);
            if (spaceMatch) {
                const day = spaceMatch[1].padStart(2, '0');
                const monthKey = spaceMatch[2].toLowerCase();
                const month = monthNames[monthKey];
                if (month) return `2025-${month}-${day}`;
            }

            // Format: "March 7", "April 3"
            const reverseMatch = raw.match(/^([A-Za-z]+)\s+(\d{1,2})$/);
            if (reverseMatch) {
                const monthKey = reverseMatch[1].toLowerCase();
                const day = reverseMatch[2].padStart(2, '0');
                const month = monthNames[monthKey];
                if (month) return `2025-${month}-${day}`;
            }

            // Try native Date parse as fallback
            const d = new Date(raw);
            if (!isNaN(d.getTime())) {
                return d.toISOString().split('T')[0];
            }

            return null;
        }

        // ─── JSONP Fetch (bypasses CORS for local files) ─────────────────
        function fetchSheetData() {
            const btn = document.getElementById('btn-refresh');
            btn.classList.add('spinning');

            // Remove any previous script tag
            const oldScript = document.getElementById('gviz-script');
            if (oldScript) oldScript.remove();

            // Define the global callback that Google's API will invoke
            window.google = window.google || {};
            window.google.visualization = window.google.visualization || {};
            window.google.visualization.Query = window.google.visualization.Query || {};
            window.google.visualization.Query.setResponse = function(response) {
                try {
                    processGvizResponse(response);
                } catch (err) {
                    console.error(err);
                    showError();
                } finally {
                    btn.classList.remove('spinning');
                }
            };

            // Create a script tag — this bypasses CORS completely
            const script = document.createElement('script');
            script.id = 'gviz-script';
            script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}&tq=${encodeURIComponent('SELECT *')}`;

            script.onerror = function() {
                btn.classList.remove('spinning');
                showError();
            };

            document.body.appendChild(script);
        }

        function showError() {
            document.getElementById('content').innerHTML = `
                <div class="error-container">
                    <div class="emoji">😵</div>
                    <h3>Couldn't fetch data</h3>
                    <p>Make sure your Google Sheet is publicly accessible:<br>
                    <strong>Share → General access → Anyone with the link → Viewer</strong></p>
                    <button class="btn btn-primary" onclick="refreshData()">🔄 Try Again</button>
                </div>
            `;
        }

        function processGvizResponse(response) {
            if (response.status === 'error') {
                showError();
                return;
            }

            const table = response.table;
            const cols = table.cols;
            const rows = table.rows;

            entries = [];
            let id = 1;

            for (let i = 0; i < rows.length; i++) {
                const cells = rows[i].c;
                if (!cells || cells.length < 5) continue;

                const dateRaw = cells[0] ? (cells[0].f || cells[0].v || '') : '';
                const studio  = cells[1] ? (cells[1].v || '') : '';
                const project = cells[2] ? (cells[2].v || '') : '';
                const budgetRaw = cells[3] ? (cells[3].f || cells[3].v || '') : '';
                const statusRaw = cells[4] ? (cells[4].v || '') : '';

                // Skip header rows
                if (studio === 'Studio' || (dateRaw && dateRaw.toString().toLowerCase().includes('date'))) continue;

                // Skip empty rows
                if (!dateRaw && !studio && !project) continue;
                if (!project || !project.toString().trim()) continue;

                // Handle date - gviz may return "Date(year, month, day)" format
                let date = null;
                const dateVal = cells[0] ? cells[0].v : null;
                if (dateVal && typeof dateVal === 'string' && dateVal.startsWith('Date(')) {
                    const parts = dateVal.replace('Date(', '').replace(')', '').split(',').map(Number);
                    date = `${parts[0]}-${String(parts[1] + 1).padStart(2, '0')}-${String(parts[2]).padStart(2, '0')}`;
                } else {
                    date = parseDate(dateRaw.toString());
                }

                const status = statusRaw ? statusRaw.toString().trim() : '';
                let normalizedStatus = 'Pending';
                if (status.toLowerCase().startsWith('paid')) normalizedStatus = 'Paid';
                else if (status.toLowerCase().startsWith('pending')) normalizedStatus = 'Pending';
                else if (status === '' || status === '-') normalizedStatus = '—';

                entries.push({
                    id: id++,
                    date: date || '2025-04-15',
                    studio: studio ? studio.toString().trim() : 'Unknown',
                    project: project.toString().trim(),
                    budget: parseBudget(budgetRaw.toString()),
                    status: normalizedStatus
                });
            }

            lastSynced = new Date();
            updateSyncInfo();
            document.getElementById('filter-bar').style.display = 'flex';
            renderAll();
            showToast('✅ Data synced from Google Sheets!');
        }

        function updateSyncInfo() {
            const el = document.getElementById('sync-info');
            if (lastSynced) {
                const time = lastSynced.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
                const date = lastSynced.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
                el.innerHTML = `✅ Last synced: <strong>${time}</strong> on ${date} &nbsp;•&nbsp; ${entries.length} entries loaded &nbsp;•&nbsp; <em>Data is read from your Google Sheet. Edit there to update.</em>`;
            }
        }

        function refreshData() {
            document.getElementById('content').innerHTML = `
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Refreshing data from Google Sheets...</div>
                </div>
            `;
            fetchSheetData();
        }

        // ─── Utilities ───────────────────────────────────────────────────
        function formatCurrency(n) {
            if (n === 0) return '—';
            return '₹ ' + n.toLocaleString('en-IN');
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        }

        function getMonthKey(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        }

        function getMonthLabel(key) {
            const [y, m] = key.split('-');
            const months = ['','January','February','March','April','May','June','July','August','September','October','November','December'];
            return months[parseInt(m)] + ' ' + y;
        }

        const monthIcons = ['','❄️','💐','🌸','🌷','☀️','🌞','🌊','🏖️','🍂','🎃','🍁','🎄'];
        function getMonthIcon(key) {
            return monthIcons[parseInt(key.split('-')[1])] || '📅';
        }

        function getFilteredEntries() {
            const studioF = document.getElementById('filter-studio').value;
            const statusF = document.getElementById('filter-status').value;
            const searchF = document.getElementById('filter-search').value.toLowerCase();
            return entries.filter(e => {
                if (studioF && e.studio !== studioF) return false;
                if (statusF && e.status !== statusF) return false;
                if (searchF && !e.project.toLowerCase().includes(searchF) && !e.studio.toLowerCase().includes(searchF)) return false;
                return true;
            });
        }

        // ─── Render ──────────────────────────────────────────────────────
        function renderAll() {
            renderSummaryCards();
            renderMonthlySections();
            populateStudioFilter();
        }

        function renderSummaryCards() {
            const filtered = getFilteredEntries();
            const totalBudget = filtered.reduce((s, e) => s + e.budget, 0);
            const paidTotal = filtered.filter(e => e.status === 'Paid').reduce((s, e) => s + e.budget, 0);
            const pendingTotal = filtered.filter(e => e.status === 'Pending').reduce((s, e) => s + e.budget, 0);
            const paidCount = filtered.filter(e => e.status === 'Paid').length;
            const pendingCount = filtered.filter(e => e.status === 'Pending').length;

            document.getElementById('summary-grid').innerHTML = `
                <div class="summary-card total">
                    <div class="card-icon">💰</div>
                    <div class="card-label">Grand Total</div>
                    <div class="card-value">${formatCurrency(totalBudget)}</div>
                    <div class="card-count">${filtered.length} entries</div>
                </div>
                <div class="summary-card paid">
                    <div class="card-icon">✅</div>
                    <div class="card-label">Paid Total</div>
                    <div class="card-value">${formatCurrency(paidTotal)}</div>
                    <div class="card-count">${paidCount} paid</div>
                </div>
                <div class="summary-card pending">
                    <div class="card-icon">⏳</div>
                    <div class="card-label">Pending Total</div>
                    <div class="card-value">${formatCurrency(pendingTotal)}</div>
                    <div class="card-count">${pendingCount} pending</div>
                </div>
            `;
        }

        function renderMonthlySections() {
            const filtered = getFilteredEntries();
            const monthMap = {};
            filtered.forEach(e => {
                const key = getMonthKey(e.date);
                if (!monthMap[key]) monthMap[key] = [];
                monthMap[key].push(e);
            });

            const sortedMonths = Object.keys(monthMap).sort();
            const container = document.getElementById('content');

            if (sortedMonths.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">🎬</div>
                        <p>No entries match your filters.</p>
                    </div>`;
                return;
            }

            container.innerHTML = sortedMonths.map((monthKey, idx) => {
                const me = monthMap[monthKey].sort((a, b) => a.date.localeCompare(b.date));
                const monthTotal = me.reduce((s, e) => s + e.budget, 0);
                const monthPaid = me.filter(e => e.status === 'Paid').reduce((s, e) => s + e.budget, 0);
                const monthPending = me.filter(e => e.status === 'Pending').reduce((s, e) => s + e.budget, 0);

                const rows = me.map(e => {
                    const statusClass = e.status === 'Paid' ? 'paid' : e.status === 'Pending' ? 'pending' : 'unknown';
                    return `
                        <tr>
                            <td>${formatDate(e.date)}</td>
                            <td><span class="studio-tag">${e.studio}</span></td>
                            <td style="white-space:normal; max-width:320px; color:var(--text-primary);">${e.project}</td>
                            <td class="budget-cell">${formatCurrency(e.budget)}</td>
                            <td>
                                <span class="status-badge ${statusClass}">
                                    <span class="status-dot"></span>
                                    ${e.status}
                                </span>
                            </td>
                        </tr>`;
                }).join('');

                return `
                    <div class="month-section" style="animation-delay:${idx * 0.06}s">
                        <div class="month-header">
                            <h2><span class="month-icon">${getMonthIcon(monthKey)}</span> ${getMonthLabel(monthKey)}</h2>
                            <div class="month-totals">
                                <div class="month-total-item">
                                    <span class="dot dot-total"></span>
                                    Total: <span class="amount clr-blue">${formatCurrency(monthTotal)}</span>
                                </div>
                                <div class="month-total-item">
                                    <span class="dot dot-paid"></span>
                                    Paid: <span class="amount clr-green">${formatCurrency(monthPaid)}</span>
                                </div>
                                <div class="month-total-item">
                                    <span class="dot dot-pending"></span>
                                    Pending: <span class="amount clr-amber">${formatCurrency(monthPending)}</span>
                                </div>
                            </div>
                        </div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Studio</th>
                                        <th>Project</th>
                                        <th>Budget</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    </div>`;
            }).join('');
        }

        function populateStudioFilter() {
            const select = document.getElementById('filter-studio');
            const current = select.value;
            const studios = [...new Set(entries.map(e => e.studio))].sort();
            select.innerHTML = `<option value="">All Studios</option>` +
                studios.map(s => `<option value="${s}" ${s === current ? 'selected' : ''}>${s}</option>`).join('');
        }

        // ─── Export ──────────────────────────────────────────────────────
        function exportCSV() {
            const filtered = getFilteredEntries();
            const header = 'Date,Studio,Project,Budget,Status\n';
            const rows = filtered.map(e =>
                `"${e.date}","${e.studio}","${e.project}",${e.budget},"${e.status}"`
            ).join('\n');
            const blob = new Blob([header + rows], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'dubbing_tracker_export.csv';
            a.click();
            URL.revokeObjectURL(url);
            showToast('📥 CSV exported!');
        }

        // ─── Toast ───────────────────────────────────────────────────────
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ─── Init ────────────────────────────────────────────────────────
        fetchSheetData();
    </script>
</body>
</html>
